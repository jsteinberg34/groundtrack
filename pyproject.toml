[project]
name = "groundtrack"
version = "0.1.2"
description = "Seismic waveform pipeline for orbital reentry events"
authors = [{name = "Joseph Steinberg", email = "josephsteinberg933@gmail.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy",
    "obspy",
    "spacetrack",
    "pandas",
    "skyfield",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "cartopy",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["groundtrack"]
branch = true

[tool.coverage.report]
show_missing = true