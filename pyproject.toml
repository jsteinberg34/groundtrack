[project]
name = "groundtrack"
version = "0.2.0"
description = "Seismic waveform pipeline for orbital reentry events"
authors = [{name = "Joseph Steinberg", email = "josephsteinberg933@gmail.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy",
    "obspy",
    "spacetrack",
    "pandas",
    "skyfield",
    "global-land-mask",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "cartopy",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["groundtrack"]
branch = true
# plotting.py is an optional visualization extra (pip install groundtrack[plotting]);
# its matplotlib/cartopy deps are not installed in CI, so it is excluded from
# coverage. Its only pure logic (_compute_extent) is still unit-tested.
omit = ["*/plotting.py"]

[tool.coverage.report]
show_missing = true
