[project]
name = "groundtrack"
version = "0.1.2"
description = "Seismic waveform pipeline for orbital reentry events"
authors = [{name = "Joseph Steinberg", email = "josephsteinberg933@gmail.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy",
    "obspy",
    "spacetrack",
    "pandas",
    "skyfield",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "cartopy",
]