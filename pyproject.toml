[project]
name = "groundtrack"
version = "0.4.0"
description = "Seismic waveform pipeline for orbital reentry events"
authors = [{name = "Joseph Steinberg", email = "jstein58@jh.edu"}]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy",
    "obspy",
    "spacetrack",
    "pandas",
    "skyfield",
    "global-land-mask",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "cartopy",
]
test = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only the package under src/ ships. tools/ holds build_provider_regions.py,
# which regenerates the provider region map from live FDSN services. It is kept
# in the repo so the map is auditable and reproducible rather than asserted, but
# it must not be installed: the library resolves providers entirely offline and
# nothing at runtime should reach the network.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["groundtrack"]
branch = true
# plotting.py is an optional visualization extra (pip install groundtrack[plotting]);
# its matplotlib/cartopy deps are not installed in CI, so it is excluded from
# coverage. Its only pure logic (_compute_extent) is still unit-tested.
omit = ["*/plotting.py"]

[tool.coverage.report]
show_missing = true
